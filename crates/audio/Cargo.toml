[package]
name = "grooph-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["playback"]
# Natively, the output device (rodio through cpal, which needs the audio
# system's headers, e.g. libasound2-dev). Without it the engine runs but
# plays nowhere: for tests on machines without those headers. The web build
# plays through cpal's WebAudio either way.
playback = ["rodio/playback"]

[dependencies]
grooph-measure = { workspace = true }
log = { workspace = true }
rodio = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true }
web-sys = { workspace = true, features = ["AudioContext", "AudioContextState", "BaseAudioContext"] }

[lints]
workspace = true
