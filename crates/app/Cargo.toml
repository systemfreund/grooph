[package]
name = "grooph-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
grooph-measure = { workspace = true }
grooph-audio = { workspace = true }
grooph-layout = { workspace = true }
grooph-link = { workspace = true }
grooph-render = { workspace = true }
grooph-midi = { workspace = true }
grooph-mic = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
log = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

# Renderer: wgpu natively; WebGL2 through glow on the web, which leaves out
# wgpu's WebGPU/WebGL layers and shader translator (about a fifth of the WASM).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { workspace = true }
eframe = { workspace = true, features = ["wgpu"] }

# The workspace eframe leaves accesskit out for Android's NativeActivity.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }

# Not used directly: restores winit's default features (see workspace eframe).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
winit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
getrandom = { workspace = true }
