[package]
name = "grooph-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The Android app: a native library that NativeActivity loads. Build the App
# Bundle and the APK with build-android.sh (see ARCHITECTURE.md, "Build and test").
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
grooph-app = { path = "../app" }
# glow (OpenGL ES): wgpu cannot create a surface in the Android emulator.
eframe = { workspace = true, features = ["android-native-activity", "glow"] }
android_logger = "0.15"
jni = "0.21"
log = { workspace = true }
winit = { workspace = true, features = ["android-native-activity"] }

[lints]
workspace = true
