[package]
name = "grooph-android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# The Android app: a native library that NativeActivity loads. Build the APK
# with `cargo apk build -p grooph-android` (see README "Android").
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
grooph-app = { path = "../app" }
eframe = { workspace = true, features = ["android-native-activity"] }
android_logger = "0.15"
log = { workspace = true }
winit = { workspace = true, features = ["android-native-activity"] }

[package.metadata.android]
package = "app.grooph"
apk_name = "grooph"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "grooph"

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"
