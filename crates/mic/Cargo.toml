[package]
name = "grooph-mic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["device"]
# Natively, the input device (cpal, which needs the audio system's headers,
# e.g. libasound2-dev). Without it there is no microphone: for tests on
# machines without those headers. The web uses getUserMedia either way.
device = ["dep:cpal"]

[dependencies]
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "AudioContext",
    "AudioContextState",
    "AudioNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "EventTarget",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaTrackSettings",
    "MessageEvent",
    "MessagePort",
    "Url",
    "Worklet",
] }

[lints]
workspace = true
