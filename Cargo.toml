[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/audio",
    "crates/layout",
    "crates/measure",
    "crates/render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["systemfreund"]
license = "LGPL-2"

[workspace.dependencies]
grooph-audio = { path = "crates/audio" }
grooph-layout = { path = "crates/layout" }
grooph-measure = { path = "crates/measure" }
grooph-render = { path = "crates/render" }

[profile.release]
opt-level = "z"
lto = true
