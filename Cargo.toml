[workspace]
resolver = "2"
members = [
    "crates/android",
    "crates/app",
    "crates/audio",
    "crates/layout",
    "crates/link",
    "crates/link-check",
    "crates/measure",
    "crates/mic",
    "crates/midi",
    "crates/render",
    "crates/site",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["systemfreund"]
license = "LGPL-2"
# The oldest toolchain that builds and tests the workspace: egui 0.37 needs
# 1.95, the tests' `assert_matches!` 1.96.
rust-version = "1.96"

# Shared by every crate through `[lints] workspace = true`. CI adds
# `-D warnings` on top.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
grooph-audio = { path = "crates/audio" }
grooph-layout = { path = "crates/layout" }
grooph-link = { path = "crates/link" }
grooph-measure = { path = "crates/measure" }
grooph-mic = { path = "crates/mic" }
grooph-midi = { path = "crates/midi" }
grooph-render = { path = "crates/render" }
cpal = { version = "0.16", features = ["wasm-bindgen"] }
# eframe's defaults without accesskit, which NativeActivity on Android cannot
# use, and without a renderer; the app crate turns accesskit back on everywhere
# else and picks the renderer per target (wgpu natively, glow on the web).
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "links",
    "persistence",
    "system_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
] }
# What eframe's `winit/default` adds (Wayland loaded at runtime, window
# decorations); turned on by the app crate on Linux and the other desktops.
winit = "0.30"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
either = "1.15.0"
env_logger = "0.11.8"
getrandom = { version = "0.3.3", features = ["wasm_js"] }
js-sys = "0.3.85"
log = "0.4.29"
midir = "0.11"
rodio = { version = "0.21", features = ["playback", "noise"] }
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Event", "EventTarget", "History", "KeyboardEvent", "Location", "MediaQueryList", "Navigator", "Performance", "RequestCache", "RequestInit", "Response", "VisibilityState", "VisualViewport", "WakeLock", "WakeLockSentinel", "WakeLockType", "Window"] }

[profile.release]
opt-level = "z"
lto = true
# One codegen unit lets LLVM optimize across the whole crate: about 2 % less
# WASM, at the cost of slower release builds.
codegen-units = 1
