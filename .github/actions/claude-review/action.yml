name: Claude Code review step
description: >-
  Runs Claude Code headless with read-only tools and one model, and writes its final JSON answer to a file
  (see .github/review/review.py extract). Never posts to GitHub itself.

inputs:
  reviewer:
    description: Name of this reviewer, shown in the summary (e.g. the model, or "rust · <model>")
    required: true
  model:
    description: Model as anthropic/<model>; the prefix is dropped for Claude Code
    required: true
  kind:
    description: general, rust or synthesis
    required: true
  prompt:
    description: The prompt
    required: true
  out:
    description: Path of the JSON file to write
    required: true
  oauth-token:
    description: Claude Code OAuth token (the secret CLAUDE_CODE_OAUTH_TOKEN)
    required: true
  github-token:
    description: Read-only token for the gh commands the agent may run
    required: true

runs:
  using: composite
  steps:
    - name: Install Claude Code
      shell: bash
      # Pinned so a new release cannot change how the agent runs or what it may do.
      run: npm install --global "@anthropic-ai/claude-code@2.1.317"

    - name: Run ${{ inputs.reviewer }}
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.oauth-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
      # Read-only, like the `review` agent of opencode.json: the file tools, and gh commands that only read.
      # --tools limits what exists, --allowedTools what runs without asking, and with no one to ask
      # (-p, dontAsk) everything else is denied. The settings, MCP servers and skills of the checked-out
      # pull request are ignored: it is the PR's code, but the token is not for it to use.
      # A failed run still leaves its events; extract turns them into an error entry.
      run: |
        claude -p "$PROMPT" --model "${MODEL#anthropic/}" \
          --output-format stream-json --verbose --no-session-persistence \
          --permission-mode dontAsk \
          --tools "Read,Grep,Glob,Bash" \
          --allowedTools "Read" "Grep" "Glob" \
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh search:*)" \
          --setting-sources user --strict-mcp-config --disable-slash-commands \
          < /dev/null > "$RUNNER_TEMP/events.jsonl" || true

    - name: Extract the answer
      # Also when the install failed, so the synthesis learns that this reviewer failed; not after a cancel.
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REVIEWER: ${{ inputs.reviewer }}
        MODEL: ${{ inputs.model }}
        KIND: ${{ inputs.kind }}
        OUT: ${{ inputs.out }}
      run: |
        mkdir -p "$(dirname "$OUT")"
        python3 .github/review/review.py extract --events "$RUNNER_TEMP/events.jsonl" \
          --out "$OUT" --reviewer "$REVIEWER" --model "$MODEL" --kind "$KIND"
