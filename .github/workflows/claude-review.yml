name: Claude review

# Reviews each pull request against its requirements (linked issue, or the PR
# description when there is none) and looks for weaknesses in the
# implementation. What the review checks lives in REVIEW.md at the repo root.
#
# Runs once when a PR is opened, reopened or marked ready for review, not on
# every push. To review again after changes, re-run the job from the Actions
# tab or use "Run workflow" with the PR number.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (create it with
# `claude setup-token`). To use an API key instead, replace
# claude_code_oauth_token below with anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they get no secrets).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || '' }}
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

            Review this pull request. Read REVIEW.md in the repository root and follow it
            exactly: find the requirements (linked issues, otherwise the PR description),
            check each one, look for weaknesses, then post the summary comment and inline
            comments as described there. CLAUDE.md describes the workspace layout.
          claude_args: >-
            --allowed-tools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
