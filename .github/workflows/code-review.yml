name: Code review

# Reviews each pull request with several models and posts one consolidated review.
#
#   setup       picks the PR, its head commit and the reviewers
#   review      one job per reviewer: every model in the list does the general
#               review (REVIEW.md); with .rs changes, one more does the Rust
#               review (.agents/skills/grooph-rust-review). Each answers with
#               JSON (REVIEW.md §4), uploaded as an artifact; nothing is posted.
#   synthesis   one model (SYNTHESIS_MODEL) merges the reviews, checks every
#               finding against the code, and decides which findings of the
#               previous review are resolved (.github/review/SYNTHESIS.md).
#   publish     a script without a model posts the result: new findings as one
#               PR review with inline comments, a reply in the thread of each
#               finding that was resolved or whose text changed, and a single
#               summary comment that is updated on every run.
#
# The summary comment carries the findings of the last run in a hidden state
# block, so each push is reviewed against the previous review and what people
# with write access answered to it. Raw reviews stay in the run's artifacts.
#
# Runs on every push to a pull request; a newer push cancels the running review.
# "Run workflow" reviews any PR number, optionally with its own model list.
#
# A comment runs only the synthesis again, with the reviews of the last run, when
# someone with write access answered a finding since: a reply in its thread, or a
# comment in the conversation that names it (F3). `review.py rerun` decides; it
# looks at all answers since the last review, so a comment that cancels a waiting
# run loses nothing. A comment never cancels a review. Comment runs use
# the workflow file of the default branch (GitHub's rule for issue_comment), but
# still the scripts and instructions of the PR's head.
#
# OpenCode runs the read-only `review` agent from opencode.json; every model
# used here must be listed there. Only the publish job can write to the pull
# request, and it runs no model. The scripts and instructions come from the
# PR's head, so a change to them is tried on its own PR; that is why PRs from
# forks are never reviewed, not even through "Run workflow".
#
# Needs the repository secret VENICE_API_KEY.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
      models:
        description: 'Models for the general review, as a JSON list, e.g. ["venice/deepseek-v4-1-flash"]. Leave blank for the default list'
        required: false

# Comment runs get their own group: in a shared one, a comment would replace a push's review that is still
# waiting. A newer comment does replace a waiting comment run, which loses nothing (see above), and a push
# that lands during a comment run wins: publish then drops the comment run's result.
concurrency:
  group: >-
    code-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr
    }}${{ endsWith(github.event_name, 'comment') && '-answers' || '' }}
  cancel-in-progress: ${{ !endsWith(github.event_name, 'comment') }}

env:
  # Default models of the general review. GLM 5.3 (venice/z-ai-glm-5-3, its
  # runs failed too often), Kimi K2.7 Code (venice/kimi-k2-7-code) and Claude
  # Sonnet 5.5 (venice/claude-sonnet-5-5) are left out but stay in
  # opencode.json for manual runs.
  DEFAULT_MODELS: '["venice/deepseek-v4-1-flash"]'
  RUST_MODEL: venice/deepseek-v4-1-flash
  SYNTHESIS_MODEL: venice/deepseek-v4-1-flash

jobs:
  setup:
    # Skip drafts, PRs from forks (they get no secrets), and comments on issues.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      head: ${{ steps.pick.outputs.head }}
      reviewers: ${{ steps.pick.outputs.reviewers }}
      # review: the full review; answers: only the synthesis, with the reviews of run `reuse`; skip: nothing.
      mode: ${{ steps.answers.outputs.mode || steps.pick.outputs.mode }}
      reuse: ${{ steps.answers.outputs.reuse }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          MODELS: ${{ inputs.models || env.DEFAULT_MODELS }}
          COMMENT: ${{ github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Not a pull request number: $PR"
            exit 1
          fi
          # "Run workflow" must not review a fork either: the jobs below run scripts from the PR's
          # head with the Venice key, and the publish job with a token that can write.
          read -r head cross <<< "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,isCrossRepository --jq '"\(.headRefOid) \(.isCrossRepository)"')"
          if [ "$cross" = true ] && [ "$COMMENT" = true ]; then
            echo "#$PR comes from a fork; forks are not reviewed."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$cross" = true ]; then
            echo "::error::#$PR comes from a fork; forks are not reviewed."
            exit 1
          fi
          if [ "$COMMENT" = true ]; then
            echo "mode=answers" >> "$GITHUB_OUTPUT"
          else
            echo "mode=review" >> "$GITHUB_OUTPUT"
          fi
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -q '\.rs$'; then
            rust=true
          else
            rust=false
          fi
          reviewers=$(jq -nc --argjson models "$MODELS" --arg rust_model "$RUST_MODEL" --argjson rust "$rust" '
            [$models[] | {name: ., model: ., kind: "general"}]
            + (if $rust then [{name: ("rust · " + $rust_model), model: $rust_model, kind: "rust"}] else [] end)')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "reviewers=$reviewers" >> "$GITHUB_OUTPUT"
          echo "Reviewing #$PR at $head with $reviewers"

      - if: steps.pick.outputs.mode == 'answers'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.head }}
          persist-credentials: false

      - id: answers
        if: steps.pick.outputs.mode == 'answers'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pick.outputs.pr }}
          HEAD: ${{ steps.pick.outputs.head }}
        run: |
          reuse=$(python3 .github/review/review.py rerun --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD")
          if [ -n "$reuse" ]; then
            echo "$reuse" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: setup
    if: needs.setup.outputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        reviewer: ${{ fromJSON(needs.setup.outputs.reviewers) }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GENERAL_TASK: >-
        Review this pull request. Read REVIEW.md in the repository root and follow it exactly: find
        the requirements (linked issues, otherwise the PR description), check each one and look for
        weaknesses. AGENTS.md describes the workspace layout.
      RUST_TASK: >-
        Do a Rust-specific review of this pull request. Read
        .agents/skills/grooph-rust-review/SKILL.md and follow it exactly.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.head }}
          persist-credentials: false

      - name: Review
        uses: ./.github/actions/opencode-review
        with:
          reviewer: ${{ matrix.reviewer.name }}
          model: ${{ matrix.reviewer.model }}
          kind: ${{ matrix.reviewer.kind }}
          out: review-output/${{ strategy.job-index }}.json
          venice-api-key: ${{ secrets.VENICE_API_KEY }}
          github-token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.setup.outputs.pr }}
            HEAD SHA: ${{ needs.setup.outputs.head }}
            MODEL: ${{ matrix.reviewer.model }}

            ${{ matrix.reviewer.kind == 'rust' && env.RUST_TASK || env.GENERAL_TASK }}

            Do not post anything to GitHub and do not modify any files: your final answer is the
            JSON object described in REVIEW.md §4, and nothing else.

      - name: Upload the review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ strategy.job-index }}
          path: review-output/
          if-no-files-found: ignore

  synthesis:
    needs: [setup, review]
    # Also after failed reviewers: the synthesis works with the reviews that came back. Not after a
    # cancel (a newer push): the reviewers it stopped would count as failed, and the newer run reviews.
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read  # the artifacts of an earlier run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.head }}
          persist-credentials: false

      - if: needs.setup.outputs.mode == 'review'
        uses: actions/download-artifact@v4
        # No artifacts when every reviewer job died early; prepare reports them as failed.
        continue-on-error: true
        with:
          pattern: review-*
          path: review-output
          merge-multiple: true

      - if: needs.setup.outputs.mode == 'answers'
        uses: actions/download-artifact@v4
        # The reviews of the run that reviewed this commit. Gone after 90 days: then prepare fails.
        continue-on-error: true
        with:
          pattern: review-*
          path: review-output
          merge-multiple: true
          run-id: ${{ needs.setup.outputs.reuse }}
          github-token: ${{ github.token }}

      - name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.setup.outputs.pr }}
          HEAD: ${{ needs.setup.outputs.head }}
          REVIEWERS: ${{ needs.setup.outputs.reviewers }}
          REUSE: ${{ needs.setup.outputs.reuse }}
        run: |
          mkdir -p review-output
          if [ -n "$REUSE" ]; then
            # Which reviewers that run expected is not known here; those that failed left an error entry.
            set -- --expected '[]' --answers-only
          else
            set -- --expected "$(jq -c '[.[].name]' <<< "$REVIEWERS")"
          fi
          python3 .github/review/review.py prepare --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD" \
            --reviews review-output --out review-input "$@"

      - name: Synthesize
        uses: ./.github/actions/opencode-review
        with:
          reviewer: synthesis
          model: ${{ env.SYNTHESIS_MODEL }}
          kind: synthesis
          out: review-input/synthesis.json
          venice-api-key: ${{ secrets.VENICE_API_KEY }}
          github-token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.setup.outputs.pr }}
            HEAD SHA: ${{ needs.setup.outputs.head }}

            Merge the reviews of this pull request into one. Read .github/review/SYNTHESIS.md and
            follow it exactly; the inputs are in review-input/. Do not post anything to GitHub and
            do not modify any files: your final answer is the JSON object described there, and
            nothing else.

      - name: Upload the synthesis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthesis
          path: review-input/

  publish:
    needs: [setup, synthesis]
    # Never after a cancel: a cancelled run would post its stopped reviewers as failed, over the newer run's review.
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: synthesis
          path: review-input

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.setup.outputs.pr }}
          HEAD: ${{ needs.setup.outputs.head }}
          REVIEWS_RUN: ${{ needs.setup.outputs.reuse || github.run_id }}
        run: |
          python3 .github/review/review.py publish --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD" \
            --input review-input --synthesis review-input/synthesis.json --model "$SYNTHESIS_MODEL" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --reviews-run "$REVIEWS_RUN"
