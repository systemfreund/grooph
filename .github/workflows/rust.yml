name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Trunk release cannot change or break the web build.
  TRUNK_VERSION: v0.21.14

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        # For the MCP server's link check (crates/link-check).
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Test the code review scripts
      run: python3 -m unittest discover -s .github/review
    - name: Test the MCP server
      run: |
        cargo build --release --target wasm32-unknown-unknown --package grooph-link-check
        node --test mcp/server.test.mjs

  web:
    # Build the web app on every push and pull request, so a WASM-only
    # break shows up before merging. The deploy publishes this build.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust (wasm32 target)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - name: Install Trunk
      run: |
        wget -qO- "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xzf- -C ~/.cargo/bin
        trunk --version
    - name: Build web app
      run: trunk build --release
      env:
        # Baked into the app and written to version.txt, so the app notices new deploys.
        GROOPH_BUILD: ${{ github.sha }}
    - name: Bundle the MCP server's Pages Function
      # As the deploy does, with the version wrangler-action installs: the
      # function imports the link check's module from dist/ (Trunk.toml), so
      # a missing module or a bundling problem shows here, not at deploy.
      run: npx --yes wrangler@3.90.0 pages functions build --outdir "$RUNNER_TEMP/functions"
    - name: Keep the build for the deploy
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: dist
        retention-days: 7

  android:
    # Build the Android app: the App Bundle for Google Play and an APK to
    # install directly (crates/android/build-android.sh). The runner image
    # ships the Android SDK and NDK. Without the upload key secrets both are
    # signed with a throwaway key, for trying out only. Download them from
    # the run's artifacts. Only pushes to main build it, not pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust (Android targets)
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked
    - name: Install the Android platform and bundletool
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
        curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" \
          https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
    - name: Set up the signing key
      # The upload key comes from the repository secrets (see ARCHITECTURE.md
      # "Build and test"); without them, a throwaway key.
      env:
        UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      run: |
        keystore="$RUNNER_TEMP/grooph.keystore"
        if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "::add-mask::$UPLOAD_KEYSTORE_PASSWORD"
          { echo "KEYSTORE_PASSWORD=$UPLOAD_KEYSTORE_PASSWORD"; echo "KEY_ALIAS=$UPLOAD_KEY_ALIAS"; } >> "$GITHUB_ENV"
        else
          keytool -genkeypair -keystore "$keystore" -alias throwaway -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=grooph test build"
          { echo "KEYSTORE_PASSWORD=android"; echo "KEY_ALIAS=throwaway"; } >> "$GITHUB_ENV"
        fi
        echo "KEYSTORE=$keystore" >> "$GITHUB_ENV"
    - name: Build the App Bundle and the APK
      # ANDROID_NDK_LATEST_HOME is set by the runner image, not the env context.
      run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" crates/android/build-android.sh
      env:
        BUNDLETOOL: ${{ runner.temp }}/bundletool.jar
        # Google Play needs a higher version code on every upload.
        VERSION_CODE: ${{ github.run_number }}
    - name: Keep the App Bundle and the APK
      uses: actions/upload-artifact@v4
      with:
        name: grooph-android
        path: |
          target/android/grooph.aab
          target/android/grooph.apk
        retention-days: 14

  deploy:
    # Publish the web app to Cloudflare Pages (grooph.app) after every push to main,
    # once the native checks and the web build have passed.
    needs: [build, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write

    steps:
    - uses: actions/checkout@v4
    - name: Fetch the web build
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: dist
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --branch main --project-name grooph
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
    - name: Node for the smoke test
      # The MCP Inspector needs Node 22.19 or newer.
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Smoke-test grooph.app's MCP server
      # With the MCP Inspector, the official client (mcp/smoke.mjs). After
      # the deploy it can only warn, not stop a broken one.
      run: node mcp/smoke.mjs https://grooph.app/mcp

  deploy-preview:
    # Publish every pull request to its own Cloudflare Pages preview
    # (<branch>.grooph.pages.dev); grooph.app keeps serving main. Pull
    # requests from forks get no secrets, so they are skipped.
    needs: [web]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    - name: Fetch the web build
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: dist
    - name: Name the preview branch
      # Cloudflare turns the branch into the preview alias the same way:
      # lowercase, everything but letters and digits as dashes.
      id: branch
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        name=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
        echo "name=$name" >> "$GITHUB_OUTPUT"
    - name: Deploy the preview to Cloudflare Pages
      id: deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --branch ${{ steps.branch.outputs.name }} --project-name grooph
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
    - name: Post the preview link on the pull request
      uses: actions/github-script@v7
      env:
        BRANCH_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
      with:
        script: |
          const marker = '<!-- grooph-preview -->';
          const { BRANCH_URL, DEPLOY_URL } = process.env;
          const body = [
            marker,
            `**Preview:** ${BRANCH_URL || DEPLOY_URL}`,
            '',
            `This commit: ${DEPLOY_URL} (${context.payload.pull_request.head.sha.slice(0, 7)})`,
          ].join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
    - name: Node for the smoke test
      # The MCP Inspector needs Node 22.19 or newer.
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Smoke-test the preview's MCP server
      # With the MCP Inspector, the official client (mcp/smoke.mjs), against
      # this commit's deployment, so a pull request shows it before merging.
      env:
        DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
      run: node mcp/smoke.mjs "$DEPLOY_URL/mcp"
